services:
  backend:
    build: ./backend
    container_name: face-attendance-backend
    ports:
      # Override with BACKEND_PORT when 8000 is already taken on the host.
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Persisted state (database + InsightFace models) lives in the named
      # volume mounted at /app/data/dbdata. Keeping it OUT of /app/data means
      # the YOLO weights baked into the image at /app/data/models stay visible.
      DATABASE_PATH: /app/data/dbdata/attendance.db
      INSIGHTFACE_HOME: /app/data/dbdata/insightface
      # Server timezone: QR session and attendance timestamps follow this.
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Client-IP presence gate (loopback is always allowed). Use the demo hotspot subnet.
      SCHOOL_SUBNET: ${SCHOOL_SUBNET:-192.168.0.0/16}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.5}
      # Rotating QR token lifetime and previous-token grace window (seconds).
      QR_ROTATION_SECONDS: ${QR_ROTATION_SECONDS:-5}
      QR_GRACE_SECONDS: ${QR_GRACE_SECONDS:-10}
    volumes:
      - backend-data:/app/data/dbdata
    restart: unless-stopped

volumes:
  backend-data:
