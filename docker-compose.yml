services:
  backend:
    build: ./backend
    container_name: face-attendance-backend
    ports:
      # Override with BACKEND_PORT when 8000 is already taken on the host.
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Persisted state (database + InsightFace models) lives in the named
      # volume mounted at /app/data/dbdata. Keeping it OUT of /app/data means
      # the YOLO weights baked into the image at /app/data/models stay visible.
      # The image also sets HOME=/app/data/dbdata: insightface 2.x caches the
      # ArcFace models under ~/.insightface and ignores INSIGHTFACE_HOME
      # (D-014), so this is what keeps the ~326 MB model set on the volume.
      DATABASE_PATH: /app/data/dbdata/attendance.db
      # Server timezone: schedule windows and stored timestamps follow this.
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      WI_FI_SUBNET: ${WI_FI_SUBNET:-192.168.1.0/24}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.5}
      ATTENDANCE_CHECK_WINDOW_MINUTES: ${ATTENDANCE_CHECK_WINDOW_MINUTES:-15}
    volumes:
      - backend-data:/app/data/dbdata
    restart: unless-stopped

volumes:
  backend-data:
